plugins {
    id 'java-library'
    // Runs ajc over the library so CacheAspect becomes a real binary aspect (this is what
    // generates the aspectOf() accessor that woven consumer code calls). The library has no
    // @Cached methods of its own, so you'll see a harmless 'adviceDidNotMatch' note.
    // Plugin version is centralized in settings.gradle (pluginManagement).
    id 'io.freefair.aspectj.post-compile-weaving'
}

group = 'com.joeyexecutive'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok (compile-time only, with its annotation processor)
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    // AspectJ runtime — CacheAspect is written against it, and consumers' woven bytecode needs it
    implementation 'org.aspectj:aspectjrt:1.9.25'

    // Cache backends — provided at compile time; consumers supply their own at runtime
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.0.0'
    compileOnly 'com.google.guava:guava:31.0.1-jre'
    compileOnly 'org.ehcache:ehcache:3.10.8'
    compileOnly 'redis.clients:jedis:5.2.0'

    // Backends exercised by the provider contract tests (Redis needs a live server, so it's
    // only compile-checked, not unit-tested here).
    testImplementation 'com.github.ben-manes.caffeine:caffeine:3.0.0'
    testImplementation 'com.google.guava:guava:31.0.1-jre'
    testImplementation 'org.ehcache:ehcache:3.10.8'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The library compiles an aspect but has no @Cached methods of its own to weave, so ajc would
// emit a noisy (and, for a caching library, misleading) 'adviceDidNotMatch' note. Silence it.
tasks.named('compileJava') {
    ajc {
        options {
            compilerArgs.add('-Xlint:adviceDidNotMatch=ignore')
        }
    }
}

test {
    useJUnitPlatform()
}
