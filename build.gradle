plugins {
    id 'java-library'
    // Weaves the @Cached aspect into compiled bytecode at build time.
    id 'io.freefair.aspectj.post-compile-weaving' version '9.5.0'
}

group = 'com.joeyexecutive'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok (compile-time only, with its annotation processor)
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    // AspectJ runtime — the woven bytecode and the aspect itself depend on it
    implementation 'org.aspectj:aspectjrt:1.9.25'

    // Cache backends — provided at compile time; consumers supply their own at runtime
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.0.0'
    compileOnly 'com.google.guava:guava:31.0.1-jre'

    // Tests run the woven example, so they need a real backend on the runtime classpath
    testImplementation 'com.github.ben-manes.caffeine:caffeine:3.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
